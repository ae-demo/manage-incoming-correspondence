apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: correspondence-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: manage-incoming-correspondence-correspondence-api
      name: http
      visibility: project
      envBindings:
        address: CORRESPONDENCE_API_URL
  resources:
    - ref: manage-incoming-c-ddf821f8
      envBindings:
        client_id: CORRESPONDENCE_AUTH_CLIENT_ID
        issuer: CORRESPONDENCE_AUTH_ISSUER
        jwks_url: CORRESPONDENCE_AUTH_JWKS_URL
        resource: CORRESPONDENCE_AUTH_RESOURCE
        scopes: CORRESPONDENCE_AUTH_SCOPES
